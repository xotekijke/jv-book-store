databaseChangeLog:
  - changeSet:
        id: 2
        author: xoteki
        changes:
          - createTable:
              tableName: roles
              columns:
                - column:
                    name: id
                    type: bigint
                    autoIncrement: true
                    constraints:
                      primaryKey: true
                - column:
                    name: name
                    type: varchar(20)
                    constraints:
                      nullable: false
                      unique: true
